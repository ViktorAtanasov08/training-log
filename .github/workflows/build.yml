name: Build and smoke checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore TrainingLog.sln
      - name: Build
        run: dotnet build TrainingLog.sln --configuration Release --no-restore --warnaserror
      - name: Check forms and validation over HTTP
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5084
        run: |
          dotnet bin/Release/net10.0/TrainingLog.dll > /tmp/traininglog.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          python3 scripts/smoke.py || { cat /tmp/traininglog.log; exit 1; }
